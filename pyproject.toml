[project]
name = "model-gateway"
version = "0.1.0"
description = "AI model gateway"
requires-python = ">=3.13"
dependencies = [
    "blacksheep==2.6.4",
    "granian==2.8.4",
    "grpcio-health-checking==1.84.0",
    "grpcio==1.84.0",
    "httpx==0.28.1",
    "litellm-core==1.106.0rc1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "orjson==3.13.0",
    "protobuf==7.36.2",
    "structlog==26.1.0",
]

[project.scripts]
model-gateway = "model_gateway.__main__:main"

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: needs a real provider account, so it is skipped unless one is configured; select it with `-m live`",
]

[tool.ruff]
line-length = 100
src = ["src"]
# Protobuf-generated modules are checked in and excluded from linting. Regenerate
# them from the .proto source; do not edit the generated files.
exclude = ["src/model_gateway/grpc/gateway_pb2.py", "src/model_gateway/grpc/gateway_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

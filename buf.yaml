# Buf module for the gateway's published contract.
#
# The .proto files under proto/ are the source of truth. The Python stubs
# under src/model_gateway/ and the Go stubs under gen/go/ are generated from
# them and checked in — regenerate, never hand-edit.
#
#   buf generate            # from the repository root, with the plugins on PATH
#
# The module path is deliberately the Python repository's own: this contract
# is published, not imported. Go callers add the module to their go.mod and
# a `replace` pointing at their local checkout.
version: v2
modules:
  - path: proto
